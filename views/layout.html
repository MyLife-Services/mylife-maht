<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
		crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" type="image/png" href="/png/favicon.png">
	<link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
	<!-- load correct script for logged in status -->
	<script type="module" src="/js/<%= locked ? 'guests' : 'members' %>.mjs"></script>
	<title>MyLife Member Services</title>
</head>
<body>
	<div id="page-loader" class="loader-container">
		<div id="page-loader-icon" class="loader"></div>
		<div id="page-loader-text" class="loader-text">Loading MyLife Member Platform</div>
	</div>
	<div id="page-header" class="header">
		<div id="experience-transport" class="experience-transport hide">
			<div id="experience-close" class="experience-transport-item" title="End and Close Experience">
				<i class="fa fa-times" aria-hidden="true"></i>
			</div>
			<div id="experience-breadcrumb" class="experience-transport-item">
				<!-- Breadcrumb items will be dynamically inserted here -->
			</div>
			<!--
			<div id="experience-skip" class="experience-transport-item" title="Skip to Next Scene">
				<i class="fa fa-forward" aria-hidden="true"></i>
			</div>
			-->
		</div>
		<div id="experience-modal" class="experience-modal hide"><% include assets/html/_experience %></div><!--- modal experience screen -->
		<div id="experience-continue" class="experience-continue hide">
            <div id="experience-continue-text" class="experience-continue-text"></div>
            <div id="experience-continue-click-text" class="experience-continue-click-text pulse">
                ...click anywhere to continue...
            </div>
        </div><!-- growing button until bright, and then alpha occluding to cover entire screen except for dialog, if any... -->
		<nav id="navigation-container" class="top-nav">
			<% include assets/html/_navbar %>
		</nav>
		<div id="alert-container" class="alert-container">
			<% include assets/html/_alerts %>
		</div>
	</div>
	<div id="main-content" class="main-content">
		<%- body %><!-- koa-ejs body inclusion -->
		<!-- sidebar area -->
		<div id="sidebar" class="sidebar">
			<% include assets/html/_sidebar %>
		</div>
	</div>
    <!-- Page Footer -->
    <footer>
		<p>&copy; 2025 MyLife. All rights reserved.</p>
	</footer>
</body>
</html>
