<!DOCTYPE HTML>
<html lang="en">
  <head>
    <title>Citizens for Rational Government PAC</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script async src="assets/js/tracking.js"></script>
    <script defer src="assets/js/loader.js"></script>
  </head>
  <body class="is-loading">
    <noscript>
      <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1648971006194004&ev=PageView&noscript=1" />
      <style>
        body.is-loading {
          opacity: 1 !important;
        }
      </style>
    </noscript>
    <div id="page-header">
      <section id="header"></section>
      <section id="main">
        <div class="container">
          <nav id="candidates-states" class="state-tabs">
            <a data-state="alabama" class="state-tab">Alabama</a>
            <a data-state="georgia" class="state-tab">Georgia</a>
            <a data-state="indiana" class="state-tab">Indiana</a>
            <a data-state="ohio" class="state-tab">Ohio</a>
            <a data-state="texas" class="state-tab">Texas</a>
          </nav>
        </div>
        <div id="state-content" class="container"></div>
      </section>
      <!-- footer -->
      <section id="footer"></section>
    </div><!-- page-header -->
  </body>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const tabs = document.querySelectorAll(".state-tabs a")
    const content = document.querySelector("#state-content")
    // Bind clicks
    tabs.forEach(tab => {
      tab.addEventListener("click", e => {
        e.preventDefault();
        loadState(tab.dataset.state);
      });
    });
    // Load default state on first visit
    loadState("alabama");
    /* functions */
    function loadState(state) {
      // Highlight active tab
      tabs.forEach(t => t.classList.toggle("active", t.dataset.state === state));
      // Load partial
      fetch(`assets/html/${state}.html`)
        .then(r => r.text())
        .then(html => {
          content.innerHTML = html;
        });
    }
});
</script>
</html>
