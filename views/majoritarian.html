<html>

    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
		crossorigin="anonymous" referrerpolicy="no-referrer">

  <body>
    <div id="page-wrapper">
      <section id="header">
        <img src="images/C4RG-header-white-background.jpeg" alt="Citizens for Rational Government" />
        <nav id="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="mission.html">What We Believe</a></li>
                <li><a href="candidates.html">Candidates We Prefer</a></li>
                <li class="current"><a>The Majoritarian Candidate</a></li>

            </ul>
        </nav>
      </section>
      <section id="main">
        <div class="container">
          <div id="main-content">
            <div id="chat-container" class="chat-container">
              <div id="chat-system" class="chat-section">
                <!-- Agent and User messages will be added via innerHTML here -->
              </div>
              <div id="chat-separator" class="chat-separator"><!-- hide but to display audio action and status -->
                <div id="audio-popup" class="audio-popup"></div>
              </div>
              <div id="chat-input-container" class="chat-input-container">
                <div id="audio-icon" class="label fas fa-microphone-lines audio-icon"></div>
                <label for="chat-input-text" class="hide"></label>
                <textarea id="chat-input-text" class="chat-input-text" title="input"></textarea>
                <button id="chat-input-submit" class="button chat-submit" type="button" disabled>Submit</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- Footer -->
      <section id="footer"></section>
    </div> <!-- /page-wrapper -->
