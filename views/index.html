<div id="chat-container" class="chat-container">
	<div id="chat-system" class="chat-section">
		<!-- Agent and User messages will be added via innerHTML here -->
	</div>
	<div id="chat-separator" class="chat-separator">
		<div id="audio-popup" class="audio-popup"></div>
	</div>
	<div id="chat-input-container" class="chat-input-container">
		<div id="audio-icon" class="label fas fa-microphone-lines audio-icon"></div>
		<textarea id="chat-input-text" class="chat-input-text"></textarea>
		<button id="chat-input-submit" class="button chat-submit" type="button" disabled>Submit</button>
	</div>
	<button id="await-button" class="await-button hide" type="button" disabled>
		<span class="spinner-border spinner-border-sm await-button-spinner" role="status" aria-hidden="true"></span>
		Connecting with <%= avatar.name %>...
	</button>
</div>
