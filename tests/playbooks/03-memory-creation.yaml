# MyLife Synthetic Testing Playbook
# Movement 03 — Memory Creation
# Suite: Memory
#
# Purpose:
#   Engage the biographer in natural language, guide it through onboarding,
#   submit an original fictional memory narrative generated by the synthetic operator,
#   and verify the created item in the collections API with full metadata and
#   summary assessment against the content the synthetic itself wrote.
#
#   This is the first movement involving real LLM responses. Assertions shift
#   from shape/value checks to cognitive evaluation — is the response useful,
#   coherent, and appropriate for a human member?
#
# Execution:
#   See SYNTHETIC_OPERATOR.md for the full operating protocol.
#   Depends on Movement 02 — context.activeBotId must be the biographer.
#
# Environment:
#   Load tests/playbooks/playbook.env before executing.

movement:
  number: "03"
  name: "Memory Creation"
  suite: memory

env:
  file: playbook.env
  vars:
    - MYLIFE_BASE_URL
    - SYNTHETIC_MBR_ID
    - SYNTHETIC_PASSPHRASE

# SYNTHETIC OPERATOR — before running any sections:
#
# 1. Generate an opening message: a genuine, slightly uncertain first-timer
#    question about how to get started. Write it yourself in your own voice —
#    do not use a template. One or two sentences.
#
# 2. Generate a fictional memory narrative to submit in section 2. Guidelines:
#    - First-person, past tense
#    - 300–600 words
#    - Emotionally specific: a real place, a real relationship, a concrete sensory detail
#    - Contains at least one unexpected or distinctive detail that a good biographer
#      should capture (you will check for it in section 3)
#    - Can be any era, setting, or relationship — use your imagination
#    Store this narrative as vars.memoryNarrative before section 2.
#    Store a list of 4–6 key facts/details you expect a good summary to cover
#    as vars.expectedSalientPoints. You will use these to score the biographer.

sections:

  - name: Ask how to get started
    # Send your self-generated opening question to the currently active biographer.
    # No itemId — fresh conversation turn.
    request:
      method: POST
      path: /members/
      body:
        message: ${vars.opening}   # your generated opening question
    assert:
      - response.success is exactly: true
      - response.responses is a non-empty array
    store:
      - key: context.openingMessage
        value: ${vars.opening}
      - key: context.openingResponse
        value: response.responses[0].message (stripped of HTML)
    assess:
      # You wrote the opening — you can judge whether the biographer's reply
      # addressed it appropriately:
      - does the response offer a clear, actionable next step or question?
      - is it substantive (not a one-liner)?
      - is it free of template artifacts ("undefined", "[object")?
      - if the response felt weak or generic, note it — you may send a
        dismissive follow-up before the memory submission in section 2

  - name: Submit fictional memory narrative
    # If section 1 was not compelling, first send a short dismissive follow-up
    # in your own words, then proceed to the narrative regardless of that response.
    #
    # Submit your generated memory narrative (vars.memoryNarrative).
    #
    # The biographer may ask a clarifying question or seek confirmation before saving.
    # Run up to 4 exchanges negotiating the save. Each exchange, you decide:
    #   - If a createItem instruction is present → memory saved, stop.
    #   - If the biographer asks for confirmation → confirm in your own words.
    #   - If it asks a clarifying question about the memory → answer with a
    #     fictional detail consistent with your narrative.
    #   - If it seems to stall → nudge it toward saving ("Please go ahead and save it.")
    # After 4 exchanges with no createItem instruction, send one final explicit
    # save request. If still nothing, the section fails.
    request:
      method: POST
      path: /members/
      body:
        message: ${vars.memoryNarrative}
    assert:
      - a createItem instruction was received (containing itemId) within the exchange loop
    store:
      - key: context.createdItemId
        value: <itemId from the createItem instruction>
      - key: context.exchangesToSave
        value: <number of exchanges before createItem appeared>
    assess:
      - how many exchanges did it take before the biographer saved?
      - if it required an explicit "please save" escalation, note it
      - was the biographer's pre-save conversation engaging — did it ask anything
        meaningful about your content, or was it formulaic?

  - name: Verify memory in collections
    # Fetch the full memory collection and locate the created item by id.
    # You know what you submitted — assess the biographer's extraction quality
    # against your own expected salient points (vars.expectedSalientPoints).
    request:
      method: GET
      path: /members/collections/memory
    assert:
      - response is an array
      - response contains an item where id == context.createdItemId
    store:
      - key: context.verifiedItem
        value: response[id=context.createdItemId]
    assess:
      # You are the authority on what was submitted — use that to judge quality.

      # Title:
      - does the title reflect the emotional or narrative core of what you wrote?
      - is it specific (references a character, place, or detail from your narrative)
        or generic (e.g. "A Childhood Memory")?

      # Keywords:
      - list the saved keywords
      - for each theme in your narrative (person, place, emotion, relationship, activity),
        check whether a corresponding keyword appears
      - estimate coverage: how many of your core themes are represented?

      # Mood:
      - what mood did the biographer assign?
      - does it match the emotional register of what you wrote?

      # Phase of life:
      - is the phaseOfLife plausible for the narrator's age in your narrative?

      # Summary thoroughness — work through vars.expectedSalientPoints one by one:
      - for each salient point you defined before running, check whether it appears
        in the saved summary
      - report salientCoverage as X/N (e.g. 5/6)
      - is the summary at least 100 characters?
      - does it read as a coherent, standalone description of the memory — or does
        it feel truncated, generic, or inaccurate?

      # Report format:
      - title: { actual, specific }
      - keywords: { saved, themesCovered, gaps }
      - mood: { actual, appropriate }
      - phaseOfLife: { actual, plausible }
      - summary: { length, salientCoverage, coherent, preview (first 150 chars) }

report:
  output_dir: tests/playbooks/results
  filename: "<YYYY-MM-DD>-03-memory-creation.md"
