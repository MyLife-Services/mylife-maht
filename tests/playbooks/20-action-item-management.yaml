# MyLife Synthetic Testing Playbook
# Movement 20 — Action Item Management
# Suite: Activism
#
# Purpose:
#   Put the civic action plan created in Movement 19 through a full editorial
#   lifecycle: direct API mutations and activism-bot-mediated NL mutations,
#   ending with a collections verification that all changes persisted.
#
# Execution:
#   See SYNTHETIC_OPERATOR.md for the full operating protocol.
#   Depends on Movement 19 — context.actionItemId and context.verifiedAction
#   must be set. context.activismBotId should be set.
#
# Environment:
#   Load tests/playbooks/playbook.env before executing.

movement:
  number: "20"
  name: "Action Item Management"
  suite: activism

env:
  file: playbook.env
  vars:
    - MYLIFE_BASE_URL
    - SYNTHETIC_MBR_ID
    - SYNTHETIC_PASSPHRASE

# SYNTHETIC OPERATOR — before running any sections, generate from your Movement 19 plan:
#
#   vars.titleA          — new title for direct API update (section 2)
#   vars.titleB          — second title for NL update via activism bot (section 3)
#   vars.detailToRemove  — a step, constraint, or phrase to remove from the summary
#   vars.detailToAdd     — a new concrete step or detail to add
#   vars.appendPhrase    — a short postscript to append directly (e.g., accountability note)
#   vars.removalRequest  — natural-language removal request
#   vars.additionRequest — natural-language addition request

sections:

  - name: Activate action in activism bot context
    request:
      method: POST
      path: /members/
      body:
        message: "I'd like to revisit my action plan. Can you give me a quick summary of where things stand?"
        itemId: ${context.actionItemId}
    assert:
      - response.success is exactly: true
      - response.responses is a non-empty array
    assess:
      - does the response reference at least one specific step from your plan?

  - name: Direct title change via PUT
    request:
      method: PUT
      path: /members/items/${context.actionItemId}
      body:
        id: ${context.actionItemId}
        title: ${vars.titleA}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItem"
    store:
      - key: context.actionCurrentTitle
        value: ${vars.titleA}
      - key: context.actionCurrentSummary
        value: response.item.summary (if present, else context.verifiedAction.summary)
    assess:
      - confirm returned title matches vars.titleA

  - name: Chat title change via activism bot
    request:
      method: POST
      path: /members/
      body:
        message: 'Please rename this action plan to "${vars.titleB}"'
        itemId: ${context.actionItemId}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItemTitle"
    store:
      - key: context.actionCurrentTitle
        value: response.instructions[command=updateItemTitle].title
    assess:
      - does the instruction title match vars.titleB?

  - name: Direct summary append via PUT
    request:
      method: PUT
      path: /members/items/${context.actionItemId}
      body:
        id: ${context.actionItemId}
        summary: ${context.actionCurrentSummary + "\n\n" + vars.appendPhrase}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItem"
    store:
      - key: context.actionCurrentSummary
        value: response.item.summary (if present, else context.actionCurrentSummary + vars.appendPhrase)
    assess:
      - confirm returned summary contains vars.appendPhrase

  - name: Chat — ask activism bot to remove a detail
    request:
      method: POST
      path: /members/
      body:
        message: ${vars.removalRequest}
        itemId: ${context.actionItemId}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItemSummary"
    store:
      - key: context.actionCurrentSummary
        value: response.instructions[command=updateItemSummary].summary
    assess:
      - does the new summary omit the target detail from vars.detailToRemove?
      - is the remaining plan still coherent and actionable?

  - name: Chat — ask activism bot to add a detail
    request:
      method: POST
      path: /members/
      body:
        message: ${vars.additionRequest}
        itemId: ${context.actionItemId}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItemSummary"
    store:
      - key: context.actionCurrentSummary
        value: response.instructions[command=updateItemSummary].summary
    assess:
      - does the new summary contain the key phrase from vars.detailToAdd?

  - name: Verify all mutations persisted in collection
    request:
      method: GET
      path: /members/collections/action
    assert:
      - response is an array
      - response contains an item where id == context.actionItemId
    assess:
      - titleCorrect: does title match context.actionCurrentTitle?
      - additionPresent: key phrase from vars.detailToAdd present?
      - removalHonored: target detail from vars.detailToRemove absent?
      - appendPresent: distinctive word from vars.appendPhrase present? (informational)
      - finalSummaryLength: N chars

report:
  output_dir: tests/playbooks/results
  filename: "<YYYY-MM-DD-HH-MM>-20-action-item-management.md"
