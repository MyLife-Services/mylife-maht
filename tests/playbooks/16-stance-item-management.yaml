# MyLife Synthetic Testing Playbook
# Movement 16 — Stance Item Management
# Suite: Political
#
# Purpose:
#   Put the political stance created in Movement 15 through a full editorial
#   lifecycle: direct API mutations and stance-bot-mediated NL mutations,
#   ending with a collections verification that all changes persisted.
#
# Execution:
#   See SYNTHETIC_OPERATOR.md for the full operating protocol.
#   Depends on Movement 15 — context.stanceItemId and context.verifiedStance
#   must be set. context.stanceBotId and context.activeBotId should be set.
#
# Environment:
#   Load tests/playbooks/playbook.env before executing.

movement:
  number: "16"
  name: "Stance Item Management"
  suite: political

env:
  file: playbook.env
  vars:
    - MYLIFE_BASE_URL
    - SYNTHETIC_MBR_ID
    - SYNTHETIC_PASSPHRASE

# SYNTHETIC OPERATOR — before running any sections, generate from your Movement 15 stance:
#
#   vars.titleA          — new title for direct API update (section 2)
#   vars.titleB          — second title for NL update via stance bot (section 3)
#   vars.detailToRemove  — a specific claim or phrase from the summary to remove
#                          (e.g., something too specific, controversial, or tangential)
#   vars.detailToAdd     — a new policy claim or supporting detail to add
#   vars.appendPhrase    — a short policy postscript to append directly
#   vars.removalRequest  — your natural-language removal request
#   vars.additionRequest — your natural-language addition request

sections:

  - name: Activate stance in bot context
    request:
      method: POST
      path: /members/
      body:
        message: "I'd like to revisit my stance. Can you summarize where I stand?"
        itemId: ${context.stanceItemId}
    assert:
      - response.success is exactly: true
      - response.responses is a non-empty array
    assess:
      - does the response reference at least one specific claim from your stance?

  - name: Direct title change via PUT
    request:
      method: PUT
      path: /members/items/${context.stanceItemId}
      body:
        id: ${context.stanceItemId}
        title: ${vars.titleA}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItem"
    store:
      - key: context.stanceCurrentTitle
        value: ${vars.titleA}
      - key: context.stanceCurrentSummary
        value: response.item.summary (if present, else context.verifiedStance.summary)
    assess:
      - confirm returned title matches vars.titleA

  - name: Chat title change via stance bot
    request:
      method: POST
      path: /members/
      body:
        message: 'Please rename this stance to "${vars.titleB}"'
        itemId: ${context.stanceItemId}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItemTitle"
    store:
      - key: context.stanceCurrentTitle
        value: response.instructions[command=updateItemTitle].title
    assess:
      - does the instruction title match vars.titleB?

  - name: Direct summary append via PUT
    request:
      method: PUT
      path: /members/items/${context.stanceItemId}
      body:
        id: ${context.stanceItemId}
        summary: ${context.stanceCurrentSummary + "\n\n" + vars.appendPhrase}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItem"
    store:
      - key: context.stanceCurrentSummary
        value: response.item.summary (if present, else context.stanceCurrentSummary + vars.appendPhrase)
    assess:
      - confirm returned summary contains vars.appendPhrase

  - name: Chat — ask stance bot to remove a detail
    request:
      method: POST
      path: /members/
      body:
        message: ${vars.removalRequest}
        itemId: ${context.stanceItemId}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItemSummary"
    store:
      - key: context.stanceCurrentSummary
        value: response.instructions[command=updateItemSummary].summary
    assess:
      - does the new summary omit the target detail from vars.detailToRemove?
      - is the remaining stance still coherent and substantive?

  - name: Chat — ask stance bot to add a detail
    request:
      method: POST
      path: /members/
      body:
        message: ${vars.additionRequest}
        itemId: ${context.stanceItemId}
    assert:
      - response.success is exactly: true
      - response.instructions contains an item where command == "updateItemSummary"
    store:
      - key: context.stanceCurrentSummary
        value: response.instructions[command=updateItemSummary].summary
    assess:
      - does the new summary contain the key phrase from vars.detailToAdd?

  - name: Verify all mutations persisted in collection
    request:
      method: GET
      path: /members/collections/stance
    assert:
      - response is an array
      - response contains an item where id == context.stanceItemId
    assess:
      - titleCorrect: does title match context.stanceCurrentTitle?
      - additionPresent: key phrase from vars.detailToAdd present?
      - removalHonored: target detail from vars.detailToRemove absent?
      - appendPresent: distinctive word from vars.appendPhrase present? (informational)
      - finalSummaryLength: N chars

report:
  output_dir: tests/playbooks/results
  filename: "<YYYY-MM-DD-HH-MM>-16-stance-item-management.md"
